name: "Build kernels"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"
  
on:
  workflow_dispatch:
    inputs:
      kernelSourceURL:
        description: "Kernel source URL"
        required: true
        type: string
        default: "https://github.com/topnotchfreaks/kernel_msm-5.15"
      kernelBranch:
        description: "Kernel branch"
        required: false
        type: string
        default: "codelinaro"
      kernelDevice:
        description: "Device (used for defconfig)"
        required: true
        type: string
        default: "gki"
      localVersion:
        description: "Custom localversion name (e.g., -mybuild)"
        required: false
        type: string
        default: ""
      buildKSU:
        description: "Build KSU variant?"
        required: true
        type: choice
        default: "both"
        options:
          - "noksu"
          - "ksu"
          - "both"

jobs:
  Build-Kernel:
    name: "🚀 Build Kernel"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: ${{ fromJSON(
          inputs.buildKSU == 'both' && '["noksu", "ksu"]' ||
          inputs.buildKSU == 'ksu' && '["ksu"]' ||
          '["noksu"]' ) }}
    env:
      kernelDir: common_${{ github.event.inputs.kernelDevice }}
      kernelName: common
      DEFCONFIG_NAME: ${{ github.event.inputs.kernelDevice }}_defconfig
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "✨ Setup workspace"
        run: |
          mkdir -p "$kernelDir"
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2

      - name: 📐 Setup SWAP 15GB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 15

      - name: 📐 Tune Swap
        run: |
          echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone --recursive --branch "${{ inputs.kernelBranch }}" \
            "${{ inputs.kernelSourceURL }}" "${{ env.kernelName }}" --depth=1

      - name: "📥 Initialize repo"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune --no-clone-bundle --no-tags -j"$(nproc --all)"

          rm -rf .repo common
          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-stable

          sed -i \
            -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
            -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r450784e/' \
            "${{ env.kernelDir }}/${{ env.kernelName }}/build.config.constants"

          sed -i '/^DEFCONFIG=gki_defconfig/d' "${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki"
          sed -i '$a\DEFCONFIG=${{ env.DEFCONFIG_NAME }}' "${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki"
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' "${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki"

          sed -i \
            -e '/^KMI_SYMBOL_LIST_STRICT_MODE=/d' \
            -e '/^TRIM_NONLISTED_KMI=/d' \
            -e '/^KMI_ENFORCED=/d' \
            -e '$a\KMI_SYMBOL_LIST_STRICT_MODE=0' \
            -e '$a\TRIM_NONLISTED_KMI=0' \
            -e '$a\KMI_ENFORCED=0' \
            -e '/^MODULES_ORDER=/d' \
            -e '/^MODULES_LIST=/d' \
            "${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64"

      - name: "⚙️ Configure kernel"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          if [ -n "${{ inputs.localVersion }}" ]; then
            echo "CONFIG_LOCALVERSION=\"${{ inputs.localVersion }}\"" >> "$CONFIG_FILE"
          fi
          cat >> "$CONFIG_FILE" <<'EOF'
          CONFIG_KALLSYMS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF
          
          
      - name: "🔧 Setup ReSukiSU + SUSFS"
        if: matrix.variant == 'ksu'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
         set -euo pipefail
         rm -rf ./KernelSU ./drivers/kernelsu ./susfs4ksu

         echo "📦 Installing ReSukiSU..."
         curl -LSsf "https://raw.githubusercontent.com/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh" | bash -s main
         test -d KernelSU || { echo "KernelSU setup did not create KernelSU/"; exit 1; }
         echo "✔ ReSukiSU installed"


         echo "🔧 Applying SUSFS kernel patch..."
         patch --batch --forward -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch
         echo "🔧 Applying SUSFS -> KernelSU patch..."
         patch --batch --forward -d KernelSU < susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
         
         echo "📦 Copying SUSFS source files..."
         cp -a susfs4ksu/kernel_patches/fs/. fs/
         cp -a susfs4ksu/kernel_patches/include/linux/. include/linux/
         rm -rf susfs4ksu
         for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
         test -s "$f" || { echo "❌ Required SUSFS file missing: $f"; exit 1; }
         done
         grep -q 'susfs.o' fs/Makefile || { echo "❌ SUSFS object is not wired in fs/Makefile"; exit 1; }
         
         echo "🔧 Adding SUSFS config..."
         CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
         cat >> "$CONFIG_FILE" <<'EOF'
         CONFIG_KSU_SUSFS=y
         CONFIG_KSU_SUSFS_SUS_PATH=y
         CONFIG_KSU_SUSFS_SUS_MOUNT=y
         CONFIG_KSU_SUSFS_SUS_KSTAT=y
         CONFIG_KSU_SUSFS_ENABLE_LOG=y
         CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
         CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
         CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
         CONFIG_KSU_SUSFS_SUS_MAP=y
         EOF
         echo "✅ SUSFS setup completed"


      - name: "🔨 Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          LTO=thin BUILD_CONFIG=${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64 \
            build/build.sh -j"$(nproc --all)"

      - name: "📦 Prepare artifact"
        working-directory: ${{ env.WORK_DIR }}
        run: cp out/dist/Image "Image.${{ matrix.variant }}"

      - name: "📤 Upload kernel"
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}
          path: ${{ env.WORK_DIR }}/Image.${{ matrix.variant }}
          retention-days: 3

  Package-Kernels:
    name: "📦 Package kernels"
    runs-on: ubuntu-latest
    needs: Build-Kernel
    steps:
      - name: "📥 Download artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./kernels/

      - name: "📦 Create flashable ZIP"
        run: |
          BUILD_TIME=$(date +'%Y-%m-%d')
          git clone --depth=1 https://github.com/topnotchfreaks/AnyKernel3 -b master AnyKernel3
          find kernels -name 'Image.*' -exec cp {} AnyKernel3/ \;
          ZIP_NAME="Anykernel3_ReSukiSU_${{ inputs.kernelBranch }}_${BUILD_TIME}.zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" . -x '.git/*'
          cd ..
          echo "ZIP_PATH=$(pwd)/$ZIP_NAME" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: "📤 Upload final package"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7

      - name: "📱 Send to Telegram"
        if: always()
        run: |
          if [[ -f "${{ env.ZIP_PATH }}" ]]; then
            curl -s -F document=@"${{ env.ZIP_PATH }}" \
              -F caption="✅ Kernel Build Complete (WildKSU) - $(date '+%Y-%m-%d %H:%M:%S')" \
              -F chat_id="${{ secrets.TELEGRAM_USER_ID }}" \
              "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
          else
            curl -s -X POST \
              -d chat_id="${{ secrets.TELEGRAM_USER_ID }}" \
              -d text="❌ Kernel build failed" \
              "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage"
          fi
